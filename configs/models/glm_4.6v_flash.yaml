# GLM-4.6V-Flash ~10B
name: glm_4.6v_flash
engine: vllm_offline
modality: mllm
type: base

vllm_init_kwargs:
  model: zai-org/GLM-4.6V-Flash
  max_model_len: 16384
  gpu_memory_utilization: 0.95
  max_num_seqs: 256
  trust_remote_code: true

sampling_params_kwargs:
  temperature: 0.0
  max_tokens: 1024

vllm_chat_kwargs:
  chat_template_kwargs: 
    enable_thinking: false